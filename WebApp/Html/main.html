<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter</title>
    <link rel="stylesheet" href="../Css/style.css">
</head>
<body>

<div class="container">

    <h1>Unit Converter</h1>

    <div class="tabs">
        <button class="tab active" data-target="length">Length</button>
        <button class="tab" data-target="weight">Weight</button>
        <button class="tab" data-target="temperature">Temperature</button>
    </div>

    <!-- LENGTH -->
    <div class="panel active" id="length">
        <div class="form-group">
            <label>Value to Convert</label>
            <input type="number" id="length-value" placeholder="Enter number">
        </div>

        <div class="form-group">
            <label>From Unit</label>
            <select id="length-from">
                <option value="mm">Millimeter</option>
                <option value="cm">Centimeter</option>
                <option value="m">Meter</option>
                <option value="km">Kilometer</option>
                <option value="inch">Inch</option>
                <option value="ft">Foot</option>
                <option value="yd">Yard</option>
                <option value="mile">Mile</option>
            </select>
        </div>

        <div class="form-group">
            <label>To Unit</label>
            <select id="length-to">
                <option value="mm">Millimeter</option>
                <option value="cm">Centimeter</option>
                <option value="m">Meter</option>
                <option value="km">Kilometer</option>
                <option value="inch">Inch</option>
                <option value="ft">Foot</option>
                <option value="yd">Yard</option>
                <option value="mile">Mile</option>
            </select>
        </div>

        <button class="convert-btn" id="convert-length">Convert</button>

        <div class="result" id="result-length"></div>
    </div>

    <!-- WEIGHT -->
    <div class="panel" id="weight">
        <div class="form-group">
            <label>Value to Convert</label>
            <input type="number" id="weight-value" placeholder="Enter number">
        </div>

        <div class="form-group">
            <label>From Unit</label>
            <select id="weight-from">
                <option value="mg">Milligram</option>
                <option value="g">Gram</option>
                <option value="kg">Kilogram</option>
                <option value="oz">Ounce</option>
                <option value="lb">Pound</option>
            </select>
        </div>

        <div class="form-group">
            <label>To Unit</label>
            <select id="weight-to">
                <option value="mg">Milligram</option>
                <option value="g">Gram</option>
                <option value="kg">Kilogram</option>
                <option value="oz">Ounce</option>
                <option value="lb">Pound</option>
            </select>
        </div>

        <button class="convert-btn" id="convert-weight">Convert</button>

        <div class="result" id="result-weight"></div>
    </div>

    <!-- TEMPERATURE -->
    <div class="panel" id="temperature">
        <div class="form-group">
            <label>Value to Convert</label>
            <input type="number" id="temp-value" placeholder="Enter number">
        </div>

        <div class="form-group">
            <label>From Unit</label>
            <select id="temp-from">
                <option value="c">Celsius</option>
                <option value="f">Fahrenheit</option>
                <option value="k">Kelvin</option>
            </select>
        </div>

        <div class="form-group">
            <label>To Unit</label>
            <select id="temp-to">
                <option value="c">Celsius</option>
                <option value="f">Fahrenheit</option>
                <option value="k">Kelvin</option>
            </select>
        </div>

        <button class="convert-btn" id="convert-temp">Convert</button>

        <div class="result" id="result-temp"></div>
    </div>

</div>


</body>
<script src="../javascript.js"></script>

</html>
